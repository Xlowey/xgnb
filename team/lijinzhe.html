<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李金浙｜个人介绍</title>
  <style>
    :root { --panel: rgba(255,255,255,.82); --line: rgba(80,67,111,.42); --ink: #302d43; --muted: #5f587a; }
    * { box-sizing: border-box; }
    body {
      min-width: 320px; min-height: 100vh; margin: 0; color: var(--ink);
      background: linear-gradient(rgba(245,243,250,.22), rgba(245,243,250,.22)), url('lijinzhe2.jpg') center / cover fixed no-repeat;
    }
    .page { display:grid; width:min(900px,calc(100% - 32px)); min-height:100vh; margin:0 auto; place-items:center; padding:32px 0; }
    .profile-back { position:fixed; top:22px; left:clamp(18px,4vw,48px); z-index:2; padding:9px 14px; border:1px solid var(--line); color:var(--muted); background:rgba(250,248,244,.9); text-decoration:none; }
    .profile-back:hover, .profile-back:focus-visible { color:var(--ink); background:#fff; outline:none; }
    .panel { display:grid; width:100%; min-height:620px; place-items:center; padding:40px; border:1px solid var(--line); background:var(--panel); box-shadow:0 18px 50px rgba(49,39,80,.24); backdrop-filter: blur(5px); }
    .profile-content { display:grid; width:min(100%,620px); justify-items:center; gap:14px; text-align:center; }
    .photo-placeholder { display:grid; width:260px; height:260px; place-items:center; overflow:hidden; border:1px solid rgba(80,67,111,.56); border-radius:50%; background:rgba(255,255,255,.42); box-shadow:0 8px 24px rgba(49,39,80,.2); }
    .photo-placeholder img { display:block; width:100%; height:100%; object-fit:cover; object-position:center; }
    .name-placeholder { margin-top:14px; font-size:clamp(2.2rem,5vw,3.2rem); font-weight:700; letter-spacing:.08em; }
    .role-placeholder { color:var(--muted); font-size:clamp(1.2rem,3.4vw,1.65rem); letter-spacing:.08em; }
    .divider { width:100%; height:1px; margin:32px 0 20px; background:var(--line); }
    .intro-placeholder { width:100%; text-align:left; }
    .intro-title { margin-bottom:14px; font-size:clamp(1.7rem,3.8vw,2.2rem); font-weight:700; letter-spacing:.08em; }
    .intro-placeholder p { margin:0; color:#3f3a50; font-size:1rem; line-height:1.9; }
    .intro-placeholder p + p { margin-top:14px; }
    @media (max-width:650px) { .page { width:min(100% - 22px,560px); padding:20px 0; } .panel { min-height:calc(100vh - 40px); padding:24px; } .photo-placeholder { width:210px; height:210px; } .profile-content { gap:12px; } .divider { margin-top:24px; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="profile-back" href="../pages/team.html">← 返回团队成员</a>
    <section class="panel">
      <div class="profile-content">
        <div class="photo-placeholder"><img src="lijinzhe.png" alt="李金浙头像"></div>
        <div class="name-placeholder">李金浙</div>
        <div class="role-placeholder">程序员、网站制作、AI &amp; 小游戏接入</div>
        <div class="divider" aria-hidden="true"></div>
        <div class="intro-placeholder">
          <div class="intro-title">个人介绍</div>
          <p>我来自浙江湖州，目前就读于数据科学与大数据技术专业。</p>
          <p>平时喜欢骑车，主要是长跑实在跑不动，骑车体力消耗不算太大，而且吹风很爽；还喜欢打乒乓球，从小学就一直当做个人爱好，虽然三个学期没选上一门乒乓球体育课。</p>
          <p>同时，我是一个音游老手，Arcaea ptt 12.91，Phigros rks 16.45，最近新入坑了 Rotaeno，期待和大佬面基（不是）。</p>
          <p>这次小组项目涉及到了我此前从未接触过的知识，对我来说是一次很有意思的实践。希望在小组成员共同努力下，我们的项目最后能顺利完成，取得满意的结果。</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
