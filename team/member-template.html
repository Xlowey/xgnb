<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    :root { --bg:#eee9e2; --panel:#faf8f4; --line:#9b7d70; --muted:#73584e; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:#2d2522; background:radial-gradient(ellipse at 14% -8%,rgba(190,143,123,.28) 0,transparent 42%),radial-gradient(ellipse at 98% 108%,rgba(126,158,157,.2) 0,transparent 40%),linear-gradient(135deg,#faf7f3 0%,#ebe5df 52%,#f5efea 100%); }
    .page { display:grid; width:min(900px,calc(100% - 32px)); min-height:100vh; margin:0 auto; place-items:center; padding:32px 0; }
    .panel { display:grid; width:100%; min-height:620px; place-items:center; padding:40px; border:1px solid var(--line); background:rgba(250,248,244,.96); box-shadow:0 18px 50px rgba(71,47,40,.16); }
    .profile-content { display:grid; width:min(100%, 620px); justify-items:center; gap:14px; text-align:center; }
    .photo-placeholder { display:grid; width:260px; height:260px; place-items:center; border:1px dashed #a88e83; border-radius:50%; color:var(--muted); text-align:center; background:repeating-linear-gradient(135deg,rgba(154,117,104,.15),rgba(154,117,104,.15) 10px,transparent 10px,transparent 20px); }
    .name-placeholder { margin-top:14px; font-size:clamp(2.2rem, 5vw, 3.2rem); font-weight:700; letter-spacing:.08em; }
    .role-placeholder { color:#6f5147; font-size:clamp(1.45rem, 3.4vw, 1.9rem); letter-spacing:.12em; }
    .divider { width:100%; height:1px; margin:32px 0 20px; background:rgba(108,80,70,.4); }
    .intro-placeholder { width:100%; text-align:left; }
    .intro-title { margin-bottom:14px; font-size:clamp(1.7rem, 3.8vw, 2.2rem); font-weight:700; letter-spacing:.08em; }
    .intro-placeholder p { margin:0; color:#4d403a; font-size:1rem; line-height:1.9; }
    @media (max-width:650px) { .page { width:min(100% - 22px,560px); padding:20px 0; } .panel { min-height:calc(100vh - 40px); padding:24px; } .photo-placeholder { width:210px; height:210px; } .profile-content { gap:12px; } .divider { margin-top:24px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="profile-content">
        <div class="photo-placeholder">照片占位</div>
        <div class="name-placeholder">姓名占位</div>
        <div class="role-placeholder">职位占位</div>
        <div class="divider" aria-hidden="true"></div>
        <div class="intro-placeholder">
          <div class="intro-title">个人介绍</div>
          <div class="role-placeholder">在此填写个人介绍。</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
