<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>存档管理 · 怪谈博物馆</title>
  <link rel="stylesheet" href="../css/style.css?v=9">
</head>
<body class="public-page-body game-public-body">
  <main class="public-page saves-page">
    <nav class="public-nav" aria-label="页面导航">
      <a href="../index.html">返回主菜单</a>
    </nav>
    <header class="public-hero">
      <p class="eyebrow">当前档案 · <span id="save-page-user">未登录</span></p>
      <h1>存档管理</h1>
      <p>自动档会持续更新，20 个手动档位可以自由覆盖、读取和删除。</p>
    </header>
    <p id="save-page-message" class="status-message" role="status" aria-live="polite"></p>
    <section class="public-panel save-page-panel">
      <div class="save-page-toolbar">
        <div>
          <p class="card-kicker">自动存档</p>
          <p id="auto-save-summary" class="save-page-summary">尚未开始探索</p>
        </div>
      </div>
      <div id="manual-save-list" class="save-page-list" aria-label="20 个手动存档位"></div>
    </section>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/saves.js"></script>
</body>
</html>
