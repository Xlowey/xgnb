<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>独立注册 · 怪谈博物馆</title>
  <link rel="stylesheet" href="../css/style.css?v=30">
  <link rel="stylesheet" href="../css/game-art-ui.css?v=2">
</head>
<body class="login-page-body game-public-body">
  <main class="login-page">
    <a class="login-back" href="login.html">← 返回登录</a>
    <section class="login-panel">
      <p class="eyebrow">夜班登记 · 新建档案</p>
      <h1>建立档案</h1>
      <form id="register-page-form" class="auth-form">
        <label for="register-page-username">档案名称</label>
        <input id="register-page-username" type="text" required maxlength="16" placeholder="1—16 个字符">
        <label for="register-page-password">设置口令</label>
        <input id="register-page-password" type="password" required placeholder="输入口令">
        <label for="register-page-password-again">再次输入口令</label>
        <input id="register-page-password-again" type="password" required>
        <button class="button button-primary" type="submit">建立档案</button>
      </form>
      <p id="register-page-message" class="status-message" role="status" aria-live="polite"></p>
      <p class="login-switch">已有档案？<a href="login.html">登录账号</a></p>
    </section>
  </main>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/register.js"></script>
</body>
</html>
