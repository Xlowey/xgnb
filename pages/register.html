<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独立注册 · 怪谈博物馆</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="public-page-body">
  <main class="public-page auth-page">
    <nav class="public-nav" aria-label="页面导航">
      <a href="../index.html">返回登录</a>
      <span>本地档案登记</span>
    </nav>
    <section class="public-panel auth-page-panel">
      <p class="eyebrow">夜班登记 · 新建档案</p>
      <h1>建立调查档案</h1>
      <p class="page-lead">账号和进度只保存在当前浏览器，用于课堂原型演示，不连接服务器。</p>
      <form id="register-page-form" class="auth-form">
        <label for="register-page-username">档案名称</label>
        <input id="register-page-username" type="text" required maxlength="16" placeholder="2—16 个字符">
        <label for="register-page-password">设置口令</label>
        <input id="register-page-password" type="password" required minlength="4" maxlength="32" placeholder="至少 4 位">
        <label for="register-page-password-again">再次输入口令</label>
        <input id="register-page-password-again" type="password" required minlength="4" maxlength="32">
        <button class="button button-primary" type="submit">建立档案</button>
      </form>
      <p id="register-page-message" class="status-message" role="status" aria-live="polite"></p>
      <nav class="page-links" aria-label="站点页面">
        <a href="../index.html">返回登录</a>
        <a href="help.html">查看玩法说明</a>
      </nav>
    </section>
  </main>
  <script src="../js/auth.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
